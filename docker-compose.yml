version: '3.8'
services:
  voxentra:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=voxentra-super-secret-jwt-key-change-in-production-32chars-min-32
      - DEMO_MODE=true
      - NODE_ENV=production
    volumes:
      - ./prisma:/app/prisma
    restart: unless-stopped

